<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Undangan Pernikahan</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Georgia', serif;
            background-color: #f4f7f9;
            color: #2b3a4a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .card {
            background-color: #ffffff;
            width: 100%;
            max-width: 450px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
            padding: 30px 20px;
            text-align: center;
            position: relative;
            /* Menggunakan cover-frame.webp langsung dari folder yang sama */
            background-image: url('cover-frame.webp');
            background-size: cover;
            background-position: center;
        }

        .header-img {
            width: 120px;
            height: auto;
            margin-bottom: 15px;
        }

        h1 {
            font-size: 24px;
            color: #1e3a8a;
            margin-bottom: 8px;
        }

        p {
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 15px;
        }

        .illustration-container {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin: 20px 0;
        }

        .illustration {
            width: 100px;
            height: 100px;
            object-fit: cover;
            border-radius: 50%;
        }

        .footer-img {
            width: 80px;
            height: auto;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <div class="card">
        <!-- Pemanggilan gambar bird.webp -->
        <img src="bird.webp" alt="Burung Decor" class="header-img">
        
        <h1>Undangan Pernikahan</h1>
        <p>Dengan memohon rahmat dan ridho Allah SWT, kami mengundang Bapak/Ibu/Saudara/i untuk hadir pada acara kami.</p>

        <div class="illustration-container">
            <!-- Pemanggilan gambar bridge.webp dan fountain.png -->
            <img src="bridge.webp" alt="Jembatan" class="illustration">
            <img src="fountain.png" alt="Air Mancur" class="illustration">
        </div>

        <p><strong>Sabtu, 20 Desember 2026</strong><br>Gedung Serbaguna Jakarta</p>
        
        <!-- Pemanggilan gambar bird.webp kembali jika diperlukan -->
        <img src="bird.webp" alt="Decor Footer" class="footer-img">
    </div>

</body>
</html>
